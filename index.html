<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Items</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .product {
      background: white;
      width: 220px;
      padding: 15px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ccc;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product h3 {
      margin: 10px 0;
    }

    .price {
      color: green;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      background: #222;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Online Store</h1>
    <p>Shopping Items</p>
  </header>

  <div class="products">

    <div class="product">
      <img src="https://picsum.photos/300/200?1" alt="T-Shirt">
      <h3>T-Shirt</h3>
      <p class="price">₹499</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://picsum.photos/300/200?2" alt="Shoes">
      <h3>Shoes</h3>
      <p class="price">₹1,499</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://picsum.photos/300/200?3" alt="Watch">
      <h3>Watch</h3>
      <p class="price">₹999</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://picsum.photos/300/200?4" alt="Backpack">
      <h3>Backpack</h3>
      <p class="price">₹799</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://picsum.photos/300/200?5" alt="Headphones">
      <h3>Headphones</h3>
      <p class="price">₹1,299</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://picsum.photos/300/200?6" alt="Sunglasses">
      <h3>Sunglasses</h3>
      <p class="price">₹599</p>
      <button>Add to Cart</button>
    </div>

  </div>

</body>
</html>
