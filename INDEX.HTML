<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart { cursor: pointer; }

    .products {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ddd;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: #111;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #333; }

    #cart {
      position: fixed;
      right: 20px;
      top: 70px;
      width: 300px;
      max-width: calc(100% - 40px);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 20px #aaa;
      display: none;
    }
    .item {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }
  </style>
</head>

<body>

<header>
  <h2>MiniShop</h2>
  <div class="cart" onclick="toggleCart()">🛒 Cart (<span id="count">0</span>)</div>
</header>

<main class="products">
  <div class="card">
    <img src="https://picsum.photos/400/300?1">
    <h3>Classic T-Shirt</h3>
    <p>₹499</p>
    <button onclick="addToCart('Classic T-Shirt',499)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://picsum.photos/400/300?2">
    <h3>Sneakers</h3>
    <p>₹1,999</p>
    <button onclick="addToCart('Sneakers',1999)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://picsum.photos/400/300?3">
    <h3>Backpack</h3>
    <p>₹899</p>
    <button onclick="addToCart('Backpack',899)">Add to Cart</button>
  </div>
</main>

<div id="cart">
  <h2>Your Cart</h2>
  <div id="items"></div>
  <hr>
  <h3>Total: ₹<span id="total">0</span></h3>
  <button onclick="checkout()">Checkout</button>
</div>

<script>
  let cart = [];

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCart();
  }

  function updateCart() {
    document.getElementById("count").textContent = cart.length;

    const items = document.getElementById("items");
    items.innerHTML = "";

    let total = 0;

    cart.forEach((item, index) => {
      total += item.price;
      items.innerHTML += `
        <div class="item">
          <span>${item.name}</span>
          <span>₹${item.price}
            <button style="width:auto;padding:3px 7px"
              onclick="removeItem(${index})">×</button>
          </span>
        </div>
      `;
    });

    document.getElementById("total").textContent = total;
  }

  function removeItem(index) {
    cart.splice(index, 1);
    updateCart();
  }

  function toggleCart() {
    const cartBox = document.getElementById("cart");
    cartBox.style.display =
      cartBox.style.display === "block" ? "none" : "block";
  }

  function checkout() {
    if (!cart.length) {
      alert("Your cart is empty!");
      return;
    }
    alert("Order placed successfully!");
    cart = [];
    updateCart();
  }
</script>

</body>
</html>
